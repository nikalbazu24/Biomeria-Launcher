name: Build & Auto-Release PRISSMA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restaurar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/prissma.jks
          fi

      - name: Compilar APK Release Firmado ARM64
        run: |
          chmod +x ./gradlew || true
          VER="1.0.0-beta.${{ github.run_number }}"
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=$VER || gradle assembleRelease -PversionCode=${{ github.run_number }} -PversionName=$VER

      - name: Renombrar APK con número de build
        run: |
          TAG="v1.0.0-beta.${{ github.run_number }}"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk "PRISSMA-Launcher-${TAG}.apk"

      - name: Subir Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRISSMA-APK
          path: PRISSMA-Launcher-*.apk

      - name: Publicar Release automático
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "PRISSMA Launcher ${{ env.RELEASE_TAG }}"
          body: "Compilación firmada generada automáticamente (Build #${{ github.run_number }})."
          files: PRISSMA-Launcher-*.apk
